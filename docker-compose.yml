version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dataforge_postgres
    restart: always
    environment:
      POSTGRES_DB: dataforge_db
      POSTGRES_USER: dataforge_user
      POSTGRES_PASSWORD: dataforge_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataforge_user -d dataforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dataforge_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataforge_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://dataforge_user:dataforge_password@postgres:5432/dataforge_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dataforge_super_secret_development_key_change_in_production
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataforge_celery_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info -c 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://dataforge_user:dataforge_password@postgres:5432/dataforge_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dataforge_super_secret_development_key_change_in_production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dataforge_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
